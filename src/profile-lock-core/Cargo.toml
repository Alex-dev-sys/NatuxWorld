[package]
name = "natux-profile-lock-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "lock-helper"
path = "src/bin/lock-helper.rs"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
] }

[dev-dependencies]
tempfile = "=3.27.0"
