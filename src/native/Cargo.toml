[package]
name = "natux-world-launcher-native"
default-run = "natux-world-launcher-native"
version = "1.10.0"
description = "NATUX WORLD Minecraft launcher desktop shell"
edition = "2021"
rust-version = "1.90"
publish = false
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
natux-profile-lock-core = { path = "../profile-lock-core" }
tauri = { version = "=2.12.3", features = ["tray-icon"] }
atomicwrites = "=0.4.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
md-5 = "=0.11.0"
sysinfo = { version = "=0.38.4", default-features = false, features = ["system"] }
uuid = { version = "=1.28.0", features = ["v4"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
base64 = "=0.22.1"
ed25519-dalek = "=3.0.0"
minisign-verify = "=0.3.0"
semver = "=1.0.28"
keyring = { version = "=4.2.0", default-features = false, features = ["v1", "windows-native-keyring-store", "apple-native-keyring-store", "zbus-secret-service-keyring-store"] }
futures-util = "=0.3.34"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "=0.4.46", default-features = false }
tokio = { version = "=1.53.2", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
url = "=2.5.8"

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[target.'cfg(target_os = "macos")'.dependencies]
smappservice-rs = "=0.1.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-dialog = "=2.6.0"
tauri-plugin-opener = "=2.7.1"
tauri-plugin-single-instance = "=2.5.3"
tauri-plugin-updater = "=2.13.3"
