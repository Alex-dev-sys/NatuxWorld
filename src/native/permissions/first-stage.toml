[[permission]]
identifier = "allow-first-stage"
description = "Allows launcher, Java, health, window, persistent settings, shell integration, playtime stats, diagnostics, account, news, and server API commands."
commands.allow = [
  "health",
  "get_version",
  "app_ready",
  "window_minimize",
  "window_maximize",
  "window_close",
  "window_is_maximized",
  "settings_get",
  "settings_set",
  "settings_get_system_memory",
  "settings_reset",
  "settings_pick_java",
  "settings_verify_java",
  "account_bootstrap",
  "account_register",
  "account_verify",
  "account_resend",
  "account_login",
  "account_login_2fa",
  "account_two_factor_setup",
  "account_two_factor_enable",
  "account_logout",
  "account_logout_global",
  "auth_login",
  "auth_logout",
  "auth_get_user",
  "shell_open_external",
  "shell_open_screenshots",
  "launcher_play",
  "launcher_get_status",
  "launcher_cancel",
  "java_detect",
  "java_install",
  "shell_playtime_get",
  "news_get_all",
  "server_get_status",
  "server_get_info",
  "shell_diagnostics_run",
  "updater_check",
  "updater_install",
]
