services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: natux
      POSTGRES_USER: natux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U natux"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      # allows container to reach host's RCON port (127.0.0.1:25575 → host machine)
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://natux:${POSTGRES_PASSWORD}@postgres:5432/natux
      NODE_ENV: production
      NEXT_PUBLIC_SERVER_NAME: ${NEXT_PUBLIC_SERVER_NAME}
      NEXT_PUBLIC_SITE_DOMAIN: ${NEXT_PUBLIC_SITE_DOMAIN}
      NEXT_PUBLIC_SERVER_IP: ${NEXT_PUBLIC_SERVER_IP}
      NEXT_PUBLIC_SERVER_VERSION: ${NEXT_PUBLIC_SERVER_VERSION}
      NEXT_PUBLIC_VK_URL: ${NEXT_PUBLIC_VK_URL}
      NEXT_PUBLIC_DISCORD_URL: ${NEXT_PUBLIC_DISCORD_URL}
      NEXT_PUBLIC_TELEGRAM_URL: ${NEXT_PUBLIC_TELEGRAM_URL}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY}
      CRYPTO_BOT_TOKEN: ${CRYPTO_BOT_TOKEN}
      CRYPTO_BOT_NETWORK: ${CRYPTO_BOT_NETWORK:-mainnet}
      YOOMONEY_WALLET: ${YOOMONEY_WALLET}
      YOOMONEY_SECRET: ${YOOMONEY_SECRET}
      # use host.docker.internal to reach Minecraft RCON on the host machine
      RCON_HOST: host.docker.internal
      RCON_PORT: ${RCON_PORT:-25575}
      RCON_PASSWORD: ${RCON_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SECRET: ${ADMIN_SECRET}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS}
      GAME_API_KEY: ${GAME_API_KEY}
      TWOFA_ENC_KEY: ${TWOFA_ENC_KEY}
      GAME_TOKEN_TTL_HOURS: ${GAME_TOKEN_TTL_HOURS:-24}
      YGGDRASIL_PRIVATE_KEY: ${YGGDRASIL_PRIVATE_KEY}
      MC_SSH_HOST: ${MC_SSH_HOST:-host.docker.internal}
      MC_SSH_USER: ${MC_SSH_USER:-agfa}
      MC_SSH_KEY_B64: ${MC_SSH_KEY_B64}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
