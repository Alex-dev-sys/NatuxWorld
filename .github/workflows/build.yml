name: Build

# The launcher lives at the repo root; the site lives in website/ and is built
# by website.yml. Ignoring website/** keeps site-only changes from triggering a
# launcher package + release.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & release
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}

    steps:
      - name: Checkout
        # actions pinned by commit SHA (supply-chain hygiene)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Read version & detect bump
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$v"
          git fetch --tags --quiet
          $exists = git tag -l $tag
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          # Only release on push to main (never on pull_request).
          if ('${{ github.event_name }}' -eq 'pull_request') {
            "release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Pull request build: typecheck + test + build only, no publish/tag."
          } elseif ([string]::IsNullOrEmpty($exists)) {
            "release=true"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Version $v is new, will publish + tag."
          } else {
            "release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Tag $tag already exists, build only."
          }

      - name: Install dependencies
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }
        shell: pwsh

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build renderer + Electron
        run: npm run build:web

      # NOTE: icon.ico is committed to the repo and used as-is. It is NOT
      # regenerated in CI from icon.png — that step previously pulled an
      # unpinned third-party package (imagemagick via choco) into a release
      # job with contents: write, an avoidable supply-chain vector.

      - name: Package & publish to Release
        if: steps.ver.outputs.release == 'true'
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign and publish trusted update manifest
        if: steps.ver.outputs.release == 'true'
        shell: pwsh
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/sign-update-manifest.mjs
          gh release upload ${{ steps.ver.outputs.tag }} release/natux-update.json release/natux-update.json.sig --clobber

      - name: Package (no publish)
        if: steps.ver.outputs.release == 'false'
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tag only AFTER a successful build + publish. If publish fails, the job
      # stops before this step, so no orphan tag is left to brick re-runs (v1.8.0 bug).
      - name: Create & push tag
        if: steps.ver.outputs.release == 'true'
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.ver.outputs.tag }}
          git push origin ${{ steps.ver.outputs.tag }}

      # Publish SHA256 sums so users can verify the unsigned installer is genuine
      # (the install guide tells them to compare against this file).
      - name: Publish checksums
        if: steps.ver.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $lines = Get-ChildItem release -Filter *.exe | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name
          }
          $lines | Out-File -Encoding ascii SHA256SUMS-windows.txt
          gh release upload ${{ steps.ver.outputs.tag }} SHA256SUMS-windows.txt --clobber

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: natux-world-windows-${{ steps.ver.outputs.version }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
            release/natux-update.json
            release/natux-update.json.sig
          if-no-files-found: warn
          retention-days: 14

  macos:
    name: Build & release (macOS .dmg)
    runs-on: macos-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build renderer + Electron
        run: npm run build:web

      - name: Package & publish .dmg to Release
        if: needs.build.outputs.release == 'true'
        run: npx electron-builder --mac --x64 --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package .dmg (no publish)
        if: needs.build.outputs.release == 'false'
        run: npx electron-builder --mac --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # The git tag + release were created by the Windows job (needs: build), so the
      # release exists here; attach the dmg checksums for integrity verification.
      - name: Publish checksums
        if: needs.build.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release
          shasum -a 256 *.dmg > SHA256SUMS-macos.txt
          gh release upload "v${{ needs.build.outputs.version }}" SHA256SUMS-macos.txt --clobber

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: natux-world-macos-${{ needs.build.outputs.version }}
          path: release/*.dmg
          if-no-files-found: warn
          retention-days: 14
