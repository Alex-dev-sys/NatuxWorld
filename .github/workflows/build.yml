name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Read version & detect bump
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$v"
          git fetch --tags --quiet
          $exists = git tag -l $tag
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ([string]::IsNullOrEmpty($exists)) {
            "release=true"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Version $v is new, will tag + publish."
          } else {
            "release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Tag $tag already exists, build only."
          }

      - name: Install dependencies
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }
        shell: pwsh

      - name: Type check
        run: npm run typecheck

      - name: Build renderer + Electron
        run: npm run build:web

      - name: Regenerate icon.ico from icon.png
        shell: pwsh
        run: |
          if (Test-Path build/icon.png) {
            choco install imagemagick.app -y --no-progress
            $magick = Get-Command magick -ErrorAction SilentlyContinue
            if ($null -eq $magick) {
              $env:Path += ";C:\Program Files\ImageMagick-7*"
            }
            magick "build/icon.png" -define icon:auto-resize=256,128,96,64,48,32,24,16 "build/icon.ico"
            Write-Host "icon.ico regenerated from icon.png"
          } else {
            Write-Host "no build/icon.png, keeping existing icon.ico"
          }

      - name: Create & push tag
        if: steps.ver.outputs.release == 'true'
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.ver.outputs.tag }}
          git push origin ${{ steps.ver.outputs.tag }}

      - name: Package & publish to Release
        if: steps.ver.outputs.release == 'true'
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package (no publish)
        if: steps.ver.outputs.release == 'false'
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natux-world-windows-${{ steps.ver.outputs.version }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: warn
          retention-days: 14
