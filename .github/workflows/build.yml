name: Build

# The launcher lives at the repo root; the site lives in website/ and is built
# by website.yml. Website-only changes do not trigger launcher packaging.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
      signed: ${{ steps.plan.outputs.signed }}
      tauri: ${{ steps.plan.outputs.tauri }}
      channel: ${{ steps.plan.outputs.channel }}
      rolloutPct: ${{ steps.plan.outputs.rolloutPct }}
      migrationEnabled: ${{ steps.plan.outputs.migrationEnabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Determine release state
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE_SIGNING_ENABLED: ${{ vars.CODE_SIGNING_ENABLED }}
          TAURI_UPDATES_ENABLED: ${{ vars.TAURI_UPDATES_ENABLED }}
          TAURI_MIGRATION_ENABLED: ${{ vars.TAURI_MIGRATION_ENABLED }}
          TAURI_ROLLOUT_PCT: ${{ vars.TAURI_ROLLOUT_PCT }}
          # The plan job runs for pull requests, so it must only learn whether
          # release credentials exist, never receive their values.
          WIN_CSC_LINK_AVAILABLE: ${{ secrets.WIN_CSC_LINK != '' }}
          WIN_CSC_KEY_PASSWORD_AVAILABLE: ${{ secrets.WIN_CSC_KEY_PASSWORD != '' }}
          CSC_LINK_AVAILABLE: ${{ secrets.CSC_LINK != '' }}
          CSC_KEY_PASSWORD_AVAILABLE: ${{ secrets.CSC_KEY_PASSWORD != '' }}
          MAC_SIGNING_IDENTITY_AVAILABLE: ${{ secrets.MAC_SIGNING_IDENTITY != '' }}
          APPLE_ID_AVAILABLE: ${{ secrets.APPLE_ID != '' }}
          APPLE_APP_SPECIFIC_PASSWORD_AVAILABLE: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
          APPLE_TEAM_ID_AVAILABLE: ${{ secrets.APPLE_TEAM_ID != '' }}
          TAURI_SIGNING_PRIVATE_KEY_AVAILABLE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          UPDATE_SIGNING_PRIVATE_KEY_AVAILABLE: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY != '' }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid package version: $version"
          }
          $tag = "v$version"
          $eligible = $env:EVENT_NAME -ne 'pull_request' -and $env:WORKFLOW_REF -eq 'refs/heads/main'
          $shouldRelease = $false
          $signed = $eligible -and $env:CODE_SIGNING_ENABLED -ieq 'true'
          $signingSecretAvailability = [ordered]@{
            WIN_CSC_LINK = $env:WIN_CSC_LINK_AVAILABLE
            WIN_CSC_KEY_PASSWORD = $env:WIN_CSC_KEY_PASSWORD_AVAILABLE
            CSC_LINK = $env:CSC_LINK_AVAILABLE
            CSC_KEY_PASSWORD = $env:CSC_KEY_PASSWORD_AVAILABLE
            MAC_SIGNING_IDENTITY = $env:MAC_SIGNING_IDENTITY_AVAILABLE
            APPLE_ID = $env:APPLE_ID_AVAILABLE
            APPLE_APP_SPECIFIC_PASSWORD = $env:APPLE_APP_SPECIFIC_PASSWORD_AVAILABLE
            APPLE_TEAM_ID = $env:APPLE_TEAM_ID_AVAILABLE
          }
          $missingSigningSecrets = @($signingSecretAvailability.GetEnumerator() |
            Where-Object { $_.Value -ine 'true' } |
            ForEach-Object { $_.Key })
          if ($signed -and $missingSigningSecrets.Count -gt 0) {
            throw "CODE_SIGNING_ENABLED requires these GitHub Actions secrets: $($missingSigningSecrets -join ', ')"
          }
          # Reviewed source policy is the default. Repository variables are
          # explicit operator overrides; missing variables cannot silently
          # publish an Electron-only release after the Tauri cutover.
          $policyJson = node scripts/resolve-launcher-release-policy.mjs | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Launcher release policy is invalid.' }
          $policy = ConvertFrom-Json -InputObject $policyJson
          $tauriRequested = $eligible -and $policy.tauri
          $migrationRequested = $tauriRequested -and $policy.migrationEnabled
          $channel = if ($version.Contains('-')) { 'beta' } else { 'stable' }
          $rolloutPct = [string]$policy.rolloutPct

          if ($tauriRequested -and $env:TAURI_SIGNING_PRIVATE_KEY_AVAILABLE -ine 'true') {
            throw 'Add the TAURI_SIGNING_PRIVATE_KEY GitHub Actions secret before enabling Tauri updates.'
          }
          if ($tauriRequested -and $env:UPDATE_SIGNING_PRIVATE_KEY_AVAILABLE -ine 'true') {
            throw 'Tauri release control metadata also requires the existing UPDATE_SIGNING_PRIVATE_KEY secret.'
          }

          if ($eligible) {
            $PSNativeCommandUseErrorActionPreference = $false
            $releaseJson = gh release view $tag --json isDraft,assets 2>$null | Out-String
            $releaseExitCode = $LASTEXITCODE
            if ($releaseExitCode -ne 0) {
              $shouldRelease = $true
              Write-Host "No GitHub release exists for $tag; a complete release will be created after platform checks pass."
            } else {
              $releaseInfo = ConvertFrom-Json -InputObject $releaseJson
              $assetNames = @($releaseInfo.assets | ForEach-Object { $_.name })
              $required = @(
                'latest.yml',
                'natux-update.json',
                'natux-update.json.sig',
                'SHA256SUMS-windows.txt',
                'SHA256SUMS-macos.txt'
              )
            if ($tauriRequested) {
              $required += @(
                'latest.json',
                'natux-tauri-control.json',
                'natux-tauri-control.json.sig',
                "NatuxWorld-$version-x64-setup.exe",
                "NatuxWorld-$version-x64-setup.exe.sig",
                "NatuxWorld-$version-x64-portable.zip",
                "NatuxWorld-$version-x86_64.app.tar.gz",
                "NatuxWorld-$version-x86_64.app.tar.gz.sig",
                "NatuxWorld-$version-aarch64.app.tar.gz",
                "NatuxWorld-$version-aarch64.app.tar.gz.sig",
                "NatuxWorld-$version-x86_64.dmg",
                "NatuxWorld-$version-aarch64.dmg",
                'SHA256SUMS-tauri.txt'
              )
            }
              $missing = @($required | Where-Object { $_ -notin $assetNames })
              $exeCount = @($assetNames | Where-Object { $_ -match '(?i)\.exe$' }).Count
              $blockmapCount = @($assetNames | Where-Object { $_ -match '(?i)\.blockmap$' }).Count
              $dmgCount = @($assetNames | Where-Object { $_ -match '(?i)\.dmg$' }).Count
              $shouldRelease = $releaseInfo.isDraft -or $missing.Count -gt 0 -or $exeCount -lt 2 -or $blockmapCount -lt 1 -or $dmgCount -lt 2
              if ($shouldRelease) {
                Write-Host "Release $tag is a draft or lacks required assets; it will be completed after platform checks pass."
              } else {
                Write-Host "Release $tag already contains the complete verified asset set."
              }
            }
          }

          if ($tauriRequested -and $env:EVENT_NAME -eq 'workflow_dispatch') {
            $shouldRelease = $true
            Write-Host 'Manual dispatch with Tauri updates enabled will rebuild this version and refresh its rollout feed.'
          }

          $tauri = $tauriRequested -and $shouldRelease
          $migrationEnabled = $tauri -and $migrationRequested
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release=$($shouldRelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "signed=$($signed.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tauri=$($tauri.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "rolloutPct=$rolloutPct" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "migrationEnabled=$($migrationEnabled.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  windows:
    name: Windows build and packaged smoke
    runs-on: windows-latest
    needs: plan
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Setup Java 21 for lock-agent tests and packaging
        id: java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install optional Electron rollback dependencies
        run: npm ci --prefix electron

      - name: Test Java lock-agent on Java 21
        run: npm run test:lock-agent

      - name: Build native lock runtime resources
        run: npm run build:lock-runtime

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test optional Electron rollback services
        run: npm run test:electron

      - name: Test release workflow contracts
        run: npm run test:release:workflow

      - name: Test legacy Electron userData path and safeStorage compatibility
        run: node --test tests/e2e/electron-safe-storage-interop.test.cjs

      - name: Test Tauri release metadata and command permissions
        run: node --test tests/scripts/generate-tauri-feed.test.mjs tests/scripts/tauri-command-contract.test.mjs tests/scripts/native-api-parity.test.mjs tests/scripts/lock-runtime-contract.test.mjs

      - name: Build renderer
        run: npm run electron:build:web

      - name: Check Windows signing prerequisites
        if: needs.plan.outputs.signed == 'true'
        run: node scripts/check-code-signing.cjs --platform win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.90.0
          components: clippy, rustfmt

      - name: Rust formatting
        run: cargo fmt --manifest-path src/native/Cargo.toml -- --check

      - name: Shared lock formatting
        run: cargo fmt --manifest-path src/profile-lock-core/Cargo.toml -- --check

      - name: Rust tests
        run: cargo test --manifest-path src/native/Cargo.toml --locked

      - name: Shared profile/game lock tests
        run: cargo test --manifest-path src/profile-lock-core/Cargo.toml --locked
        env:
          NATUX_PROFILE_LOCK_JAVA_HOME: ${{ steps.java.outputs.path }}

      - name: Shared lock clippy
        run: cargo clippy --manifest-path src/profile-lock-core/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test Tauri control signature verifier
        run: cargo test --manifest-path scripts/tauri-control-verifier/Cargo.toml --locked

      - name: Rust lint
        run: cargo clippy --manifest-path src/native/Cargo.toml --all-targets --locked -- -D warnings

      - name: Import Tauri Windows signing certificate
        if: needs.plan.outputs.tauri == 'true' && needs.plan.outputs.signed == 'true'
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'natux-tauri-signing.pfx'
          $certificateLink = $env:WIN_CSC_LINK.Trim()
          $isLocalFile = $certificateLink.Length -lt 260 -and (Test-Path -LiteralPath $certificateLink -PathType Leaf)
          if ($isLocalFile) {
            Copy-Item -LiteralPath $certificateLink -Destination $certificatePath
          } else {
            $encoded = $certificateLink -replace '\s', ''
            if ($encoded.StartsWith('data:') -and $encoded.Contains(',')) {
              $encoded = $encoded.Substring($encoded.IndexOf(',') + 1)
            }
            try {
              [System.IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($encoded))
            } catch {
              throw 'WIN_CSC_LINK must be a PFX file path or a base64-encoded PFX.'
            }
          }

          $password = ConvertTo-SecureString -String $env:WIN_CSC_KEY_PASSWORD -AsPlainText -Force
          $certificates = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password -Exportable
          $codeSigningOid = '1.3.6.1.5.5.7.3.3'
          $certificate = $certificates | Where-Object {
            @($_.EnhancedKeyUsageList | ForEach-Object { $_.ObjectId.Value }) -contains $codeSigningOid
          } | Select-Object -First 1
          if (-not $certificate) { throw 'WIN_CSC_LINK does not contain a code-signing certificate.' }

          $configPath = Join-Path $env:RUNNER_TEMP 'natux-tauri-windows-signing.json'
          $config = @{ bundle = @{ windows = @{
            certificateThumbprint = $certificate.Thumbprint
            digestAlgorithm = 'sha256'
            timestampUrl = 'http://timestamp.digicert.com'
          } } } | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText($configPath, $config, [System.Text.UTF8Encoding]::new($false))
          "TAURI_WINDOWS_SIGNING_CONFIG=$configPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Tauri Windows updater bundle
        if: needs.plan.outputs.tauri == 'true'
        shell: pwsh
        env:
          NATUX_CODE_SIGNING_ENABLED: ${{ needs.plan.outputs.signed }}
          NATUX_TAURI_UPDATES_ENABLED: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:NATUX_CODE_SIGNING_ENABLED -eq 'true') {
            node scripts/run-tauri.mjs build --config src/native/tauri.updater.conf.json --bundles nsis --config "$env:TAURI_WINDOWS_SIGNING_CONFIG"
          } else {
            node scripts/run-tauri.mjs build --config src/native/tauri.updater.conf.json --bundles nsis
          }
          $bundle = 'src/native/target/release/bundle/nsis'
          $installers = @(Get-ChildItem $bundle -File -Filter '*.exe')
          if ($installers.Count -ne 1) { throw 'Tauri did not produce exactly one NSIS installer.' }
          $installer = $installers[0]
          $application = Join-Path (Get-Location) 'src/native/target/release/natux-world-launcher-native.exe'
          if ($env:NATUX_CODE_SIGNING_ENABLED -eq 'true') {
            $signingConfig = Get-Content -LiteralPath $env:TAURI_WINDOWS_SIGNING_CONFIG -Raw | ConvertFrom-Json
            $expectedThumbprint = [string]$signingConfig.bundle.windows.certificateThumbprint
            foreach ($signedFile in @($application, $installer.FullName)) {
              $authenticode = Get-AuthenticodeSignature -FilePath $signedFile
              if ($authenticode.Status -ne 'Valid') {
                throw "Tauri artifact is not validly Authenticode signed: $signedFile ($($authenticode.Status))"
              }
              if ($authenticode.SignerCertificate.Thumbprint -ne $expectedThumbprint) {
                throw "Tauri artifact was signed by an unexpected certificate: $signedFile"
              }
            }
          }
          $signature = Get-Item -LiteralPath "$($installer.FullName).sig" -ErrorAction SilentlyContinue
          if (-not $signature) { throw 'Tauri did not produce the updater signature for the Windows installer.' }
          cargo run --manifest-path src/native/Cargo.toml --locked --bin verify-updater-signature -- "$($installer.FullName)" "$($installer.FullName).sig"
          if ($LASTEXITCODE -ne 0) { throw 'Tauri Windows updater signature did not match the embedded public key.' }
          New-Item -ItemType Directory -Force -Path release/tauri | Out-Null
          Copy-Item $installer.FullName 'release/tauri/NatuxWorld-${{ needs.plan.outputs.version }}-x64-setup.exe'
          Copy-Item $signature.FullName 'release/tauri/NatuxWorld-${{ needs.plan.outputs.version }}-x64-setup.exe.sig'
          $executableHash = (Get-FileHash -LiteralPath $application -Algorithm SHA512).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'release/tauri/executable-sha512-windows-x86_64.txt'), $executableHash, [System.Text.Encoding]::ASCII)

      - name: Build Tauri Windows validation bundle
        if: needs.plan.outputs.tauri != 'true'
        run: node scripts/run-tauri-validation-build.mjs --bundles nsis

      - name: Ensure WebView2 Runtime for Tauri packaged smoke test
        shell: pwsh
        run: |
          $runtimeKeyPaths = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $runtimeVersion = $null
          foreach ($keyPath in $runtimeKeyPaths) {
            $versionText = (Get-ItemProperty -LiteralPath $keyPath -Name pv -ErrorAction SilentlyContinue).pv
            if ($versionText) {
              try {
                $parsedVersion = [version]$versionText
                if ($parsedVersion -gt [version]'0.0.0.0') {
                  $runtimeVersion = $parsedVersion
                  break
                }
              } catch { }
            }
          }
          if (-not $runtimeVersion) {
            $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebView2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
            $installation = Start-Process -FilePath $bootstrapper -ArgumentList '/silent', '/install' -Wait -PassThru -WindowStyle Hidden
            if ($installation.ExitCode -notin @(0, 3010)) {
              throw "WebView2 Runtime bootstrapper failed with exit code $($installation.ExitCode)."
            }
            foreach ($keyPath in $runtimeKeyPaths) {
              $versionText = (Get-ItemProperty -LiteralPath $keyPath -Name pv -ErrorAction SilentlyContinue).pv
              if ($versionText) {
                try {
                  $parsedVersion = [version]$versionText
                  if ($parsedVersion -gt [version]'0.0.0.0') {
                    $runtimeVersion = $parsedVersion
                    break
                  }
                } catch { }
              }
            }
          }
          if (-not $runtimeVersion) { throw 'WebView2 Runtime is still missing after the silent install.' }
          Write-Host "WebView2 Runtime $runtimeVersion is available for the Tauri smoke test."

      - name: Prepare ordinary Windows user context for WebView2 acceptance
        shell: pwsh
        run: |
          if (-not (Get-Command gsudo.exe -ErrorAction SilentlyContinue)) {
            winget install --exact --id gerardog.gsudo --source winget --accept-source-agreements --accept-package-agreements --disable-interactivity
            if ($LASTEXITCODE -ne 0) { throw 'Could not install the Windows CI integrity helper.' }
            $helperDirectory = Join-Path $env:ProgramFiles 'gsudo/Current'
            if (-not (Test-Path -LiteralPath (Join-Path $helperDirectory 'gsudo.exe') -PathType Leaf)) {
              throw 'Installed gsudo executable is missing.'
            }
            $helperDirectory | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          $workspace = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path
          $repository = (git rev-parse --show-toplevel).Trim()
          if ($workspace -ine $repository.Replace('/', '\')) { throw 'CI workspace does not match the repository.' }
          $runnerSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          icacls $workspace /grant ('*{0}:(OI)(CI)F' -f $runnerSid) /T /Q
          if ($LASTEXITCODE -ne 0) { throw 'Could not grant the runner account access to its workspace.' }

      - name: Packaged Tauri smoke test
        run: ./scripts/run-windows-acceptance.ps1 -Suite packaged
        env:
          NATUX_TAURI_E2E_EXECUTABLE: src/native/target/release/natux-world-launcher-native.exe
          NATUX_TAURI_E2E_DEBUG_PORT: '9222'

      - name: Tauri live acceptance preflight
        run: npm run test:tauri:live
        env:
          NATUX_TAURI_E2E_DEBUG_PORT: '9222'

      - name: Package Tauri portable ZIP from tested native binary
        run: node scripts/package-tauri-portable.mjs

      - name: Test Tauri portable profile and relocation
        run: ./scripts/run-windows-acceptance.ps1 -Suite portable

      - name: Tauri signed upgrade acceptance preflight
        run: npm run test:tauri:upgrade

      - name: Test compiled production NSIS migration hooks
        run: node --test tests/scripts/tauri-installer-hooks.test.mjs

      - name: Package Windows (signed)
        if: needs.plan.outputs.signed == 'true'
        run: npm run electron:package -- --config config/electron-builder.signed.cjs --win --x64 --publish never
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Package Windows (unsigned)
        if: needs.plan.outputs.signed != 'true'
        run: npm run electron:package -- --win --x64 --publish never

      - name: Packaged Windows smoke test
        run: npm run test:electron:packaged
        env:
          NATUX_E2E_EXECUTABLE: release/win-unpacked/NATUX WORLD.exe

      - name: Installed Tauri and Electron rollback smoke test
        run: ./scripts/run-windows-acceptance.ps1 -Suite installed
        env:
          NATUX_TAURI_E2E_DEBUG_PORT: '9222'
          NATUX_TAURI_E2E_INSTALLER: ${{ needs.plan.outputs.tauri == 'true' && format('release/tauri/NatuxWorld-{0}-x64-setup.exe', needs.plan.outputs.version) || '' }}
          NATUX_TAURI_E2E_EXECUTABLE_HASH_FILE: ${{ needs.plan.outputs.tauri == 'true' && 'release/tauri/executable-sha512-windows-x86_64.txt' || '' }}

      - name: Accept published Electron to Tauri installation migration
        # The test mutates installer registration only on a fresh hosted VM.
        # Forked repositories retain pure migration tests without installing.
        if: github.repository == 'Alex-dev-sys/NatuxWorld'
        shell: pwsh
        env:
          NATUX_TAURI_ELECTRON_MIGRATION_ACCEPTANCE: '1'
          NATUX_TAURI_ELECTRON_MIGRATION_DEDICATED_ACCOUNT: 'YES'
          NATUX_TAURI_ELECTRON_MIGRATION_EPHEMERAL_CI: 'YES'
          NATUX_TAURI_E2E_INSTALLER: ${{ needs.plan.outputs.tauri == 'true' && format('release/tauri/NatuxWorld-{0}-x64-setup.exe', needs.plan.outputs.version) || format('src/native/target/release/bundle/nsis/NATUX WORLD_{0}_x64-setup.exe', needs.plan.outputs.version) }}
          NATUX_TAURI_E2E_EXECUTABLE_HASH_FILE: ${{ needs.plan.outputs.tauri == 'true' && 'release/tauri/executable-sha512-windows-x86_64.txt' || '' }}
        run: |
          $env:NATUX_TAURI_ELECTRON_MIGRATION_WINDOWS_ACCOUNT = [Environment]::UserName
          if (-not $env:NATUX_TAURI_E2E_EXECUTABLE_HASH_FILE) {
            New-Item -ItemType Directory -Force -Path tests/.runtime | Out-Null
            $application = Join-Path (Get-Location) 'src/native/target/release/natux-world-launcher-native.exe'
            $hash = (Get-FileHash -LiteralPath $application -Algorithm SHA512).Hash.ToLowerInvariant()
            $hashFile = Join-Path (Get-Location) 'tests/.runtime/migration-native-sha512.txt'
            [System.IO.File]::WriteAllText($hashFile, $hash, [System.Text.Encoding]::ASCII)
            $env:NATUX_TAURI_E2E_EXECUTABLE_HASH_FILE = $hashFile
          }
          ./scripts/run-windows-acceptance.ps1 -Suite electron-migration

      - name: Sign update manifest and write Windows checksums
        if: needs.plan.outputs.release == 'true'
        shell: pwsh
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          node scripts/sign-update-manifest.mjs
          $files = @(Get-ChildItem release -File -Filter *.exe)
          if ($files.Count -lt 2) { throw 'Expected Windows Setup and Portable installers.' }
          $lines = $files | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + "  " + $_.Name
          }
          [System.IO.File]::WriteAllLines((Join-Path (Resolve-Path release) 'SHA256SUMS-windows.txt'), $lines, [System.Text.Encoding]::ASCII)

      - name: Upload verified Windows release files
        if: needs.plan.outputs.release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: natux-world-windows-${{ needs.plan.outputs.version }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/natux-update.json
            release/natux-update.json.sig
            release/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Tauri Windows updater bundle
        if: needs.plan.outputs.tauri == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: natux-world-tauri-windows-${{ needs.plan.outputs.version }}
          path: release/tauri/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS build and packaged smoke
    runs-on: macos-latest
    needs: plan
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Setup Java 21 for lock-agent tests and packaging
        id: java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install optional Electron rollback dependencies
        run: npm ci --prefix electron

      - name: Test Java lock-agent on Java 21
        run: npm run test:lock-agent

      - name: Build native lock runtime resources
        run: npm run build:lock-runtime

      - name: Test Electron legacy userData path on macOS
        run: node --test tests/e2e/electron-safe-storage-interop.test.cjs

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test optional Electron rollback services
        run: npm run test:electron

      - name: Build renderer
        run: npm run electron:build:web

      - name: Check macOS signing prerequisites
        if: needs.plan.outputs.signed == 'true'
        run: node scripts/check-code-signing.cjs --platform mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Install pinned Rust toolchain and macOS targets
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.90.0
          components: clippy,rustfmt
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust formatting
        run: cargo fmt --manifest-path src/native/Cargo.toml -- --check

      - name: Shared lock formatting
        run: cargo fmt --manifest-path src/profile-lock-core/Cargo.toml -- --check

      - name: Rust tests
        run: cargo test --manifest-path src/native/Cargo.toml --locked

      - name: Shared profile/game lock tests
        run: cargo test --manifest-path src/profile-lock-core/Cargo.toml --locked
        env:
          NATUX_PROFILE_LOCK_JAVA_HOME: ${{ steps.java.outputs.path }}

      - name: Shared lock clippy
        run: cargo clippy --manifest-path src/profile-lock-core/Cargo.toml --all-targets --locked -- -D warnings

      - name: Rust lint
        run: cargo clippy --manifest-path src/native/Cargo.toml --all-targets --locked -- -D warnings

      - name: Build Tauri macOS validation bundle
        if: needs.plan.outputs.tauri != 'true'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: '-'
          NATUX_TAURI_UPDATES_ENABLED: '0'
        run: |
          set -euo pipefail
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            npm run tauri:build -- --target "$target" --bundles app,dmg
          done

      - name: Import Tauri macOS signing certificate
        if: needs.plan.outputs.tauri == 'true' && needs.plan.outputs.signed == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/natux-tauri-signing.p12"
          if [[ -f "$APPLE_CERTIFICATE" ]]; then
            cp "$APPLE_CERTIFICATE" "$certificate_path"
          else
            printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$certificate_path" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain | grep -Fq "$APPLE_SIGNING_IDENTITY" || {
            echo 'Configured MAC_SIGNING_IDENTITY was not found in the imported certificate.'
            exit 1
          }

      - name: Build Tauri macOS updater bundles
        if: needs.plan.outputs.tauri == 'true'
        shell: bash
        env:
          NATUX_CODE_SIGNING_ENABLED: ${{ needs.plan.outputs.signed }}
          NATUX_TAURI_UPDATES_ENABLED: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ "$NATUX_CODE_SIGNING_ENABLED" != 'true' ]]; then
            # Ad-hoc signing avoids Apple Silicon treating downloaded builds as damaged.
            # Gatekeeper may still require the user to approve the app manually.
            export APPLE_SIGNING_IDENTITY='-'
          fi
          mkdir -p release/tauri
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            if [[ "$target" == x86_64-* ]]; then arch=x86_64; else arch=aarch64; fi
            npm run tauri:build:updater -- --target "$target" --bundles dmg
            macos_bundle_dir="src/native/target/$target/release/bundle/macos"
            dmg_bundle_dir="src/native/target/$target/release/bundle/dmg"
            updater_bundle=$(find "$macos_bundle_dir" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)
            [[ -n "$updater_bundle" ]] || { echo "Tauri updater bundle missing for $arch"; exit 1; }
            [[ -f "$updater_bundle.sig" ]] || { echo "Tauri updater signature missing for $arch"; exit 1; }
            cargo run --manifest-path src/native/Cargo.toml --locked --bin verify-updater-signature -- "$updater_bundle" "$updater_bundle.sig"
            dmg=$(find "$dmg_bundle_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)
            [[ -n "$dmg" ]] || { echo "Tauri macOS DMG missing for $arch"; exit 1; }
            app_bundle=$(find "$macos_bundle_dir" -maxdepth 1 -type d -name '*.app' -print -quit)
            [[ -n "$app_bundle" ]] || { echo "Tauri macOS app bundle missing for $arch"; exit 1; }
            codesign --verify --deep --strict --verbose=2 "$app_bundle"
            signature_details=$(codesign -dv --verbose=4 "$app_bundle" 2>&1)
            if [[ "$NATUX_CODE_SIGNING_ENABLED" == 'true' ]]; then
              expected_identity=$(security find-identity -v -p codesigning build.keychain |
                awk -v configured="$APPLE_SIGNING_IDENTITY" '
                  /^[[:space:]]*[0-9]+\)/ {
                    hash = $2
                    if (match($0, /"[^"]+"/)) {
                      name = substr($0, RSTART + 1, RLENGTH - 2)
                      if (toupper(hash) == toupper(configured) || name == configured) {
                        print name
                        exit
                      }
                    }
                  }')
              [[ -n "$expected_identity" ]] || {
                echo 'Configured macOS signing identity is not an exact keychain name or certificate thumbprint.'
                exit 1
              }
              grep -F "Authority=$expected_identity" <<< "$signature_details" >/dev/null || {
                echo "Tauri macOS app was not signed by the configured identity for $arch."
                exit 1
              }
              spctl --assess --type execute --verbose=2 "$app_bundle"
              xcrun stapler validate "$dmg"
            else
              grep -F 'Signature=adhoc' <<< "$signature_details" >/dev/null || {
                echo "Tauri macOS app is missing its expected ad-hoc signature for $arch."
                exit 1
              }
            fi
            cp "$updater_bundle" "release/tauri/NatuxWorld-${{ needs.plan.outputs.version }}-$arch.app.tar.gz"
            cp "$updater_bundle.sig" "release/tauri/NatuxWorld-${{ needs.plan.outputs.version }}-$arch.app.tar.gz.sig"
            cp "$dmg" "release/tauri/NatuxWorld-${{ needs.plan.outputs.version }}-$arch.dmg"
            executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_bundle/Contents/Info.plist")"
            shasum -a 512 "$app_bundle/Contents/MacOS/$executable_name" | awk '{print $1}' > "release/tauri/executable-sha512-darwin-$arch.txt"
          done

      - name: Package macOS (signed)
        if: needs.plan.outputs.signed == 'true'
        run: npm run electron:package -- --config config/electron-builder.signed.cjs --mac --x64 --arm64 --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package macOS (unsigned)
        if: needs.plan.outputs.signed != 'true'
        run: npm run electron:package -- --mac --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Packaged macOS smoke test
        # Manual migration-branch validation runs the dedicated Tauri smoke below;
        # keep the legacy Electron CDP smoke on PRs and main-branch release builds.
        if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          app_executable="$(find release -type f -path '*/NATUX WORLD.app/Contents/MacOS/NATUX WORLD' -print -quit)"
          test -n "$app_executable" || { echo 'Packaged macOS executable not found'; exit 1; }
          NATUX_E2E_EXECUTABLE="$PWD/$app_executable" npm run test:electron:packaged

      - name: Stage exact Tauri macOS acceptance artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/tauri-acceptance
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            if [[ "$target" == x86_64-* ]]; then arch=x86_64; else arch=aarch64; fi
            name="NatuxWorld-${{ needs.plan.outputs.version }}-$arch.dmg"
            hash="executable-sha512-darwin-$arch.txt"
            if [[ '${{ needs.plan.outputs.tauri }}' == 'true' ]]; then
              # These bytes are also uploaded to the published version release.
              cp "release/tauri/$name" "release/tauri-acceptance/$name"
              cp "release/tauri/$hash" "release/tauri-acceptance/$hash"
            else
              bundle_dir="src/native/target/$target/release/bundle/macos"
              dmg="$(find "src/native/target/$target/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
              app_bundle="$(find "$bundle_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
              test -n "$dmg" && test -n "$app_bundle" || { echo "Tauri validation bundle missing for $arch"; exit 1; }
              codesign --verify --deep --strict "$app_bundle"
              executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_bundle/Contents/Info.plist")"
              cp "$dmg" "release/tauri-acceptance/$name"
              shasum -a 512 "$app_bundle/Contents/MacOS/$executable_name" | awk '{print $1}' > "release/tauri-acceptance/$hash"
            fi
          done

      - name: Upload Tauri macOS acceptance artifacts on every branch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: natux-world-tauri-macos-acceptance-${{ needs.plan.outputs.version }}
          path: release/tauri-acceptance/*
          if-no-files-found: error
          retention-days: 14

      - name: Write macOS checksums
        if: needs.plan.outputs.release == 'true'
        shell: bash
        run: |
          dmg_count=$(find release -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')
          test "$dmg_count" -ge 2 || { echo 'Expected Intel and Apple Silicon DMGs'; exit 1; }
          (cd release && shasum -a 256 *.dmg > SHA256SUMS-macos.txt)

      - name: Upload verified macOS release files
        if: needs.plan.outputs.release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: natux-world-macos-${{ needs.plan.outputs.version }}
          path: |
            release/*.dmg
            release/SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Tauri macOS updater bundles
        if: needs.plan.outputs.tauri == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: natux-world-tauri-macos-${{ needs.plan.outputs.version }}
          path: release/tauri/*
          if-no-files-found: error
          retention-days: 14

  macos_acceptance:
    name: Tauri macOS native ${{ matrix.arch }} DMG acceptance
    needs: [plan, macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install acceptance dependencies
        run: npm ci

      - name: Download exact macOS DMGs and native hashes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "natux-world-tauri-macos-acceptance-$VERSION" --dir release/tauri-acceptance

      - name: Run exact DMG on its native architecture
        run: node --test tests/e2e/tauri-macos-packaged.test.cjs
        env:
          NATUX_TAURI_MACOS_E2E_ARCH: ${{ matrix.arch }}
          NATUX_TAURI_MACOS_E2E_VERSION: ${{ needs.plan.outputs.version }}
          NATUX_TAURI_MACOS_E2E_DMG: release/tauri-acceptance/NatuxWorld-${{ needs.plan.outputs.version }}-${{ matrix.arch }}.dmg
          NATUX_TAURI_MACOS_E2E_EXECUTABLE_HASH_FILE: release/tauri-acceptance/executable-sha512-darwin-${{ matrix.arch }}.txt

  publish:
    name: Publish complete release
    runs-on: ubuntu-latest
    needs: [plan, windows, macos, macos_acceptance]
    if: needs.plan.outputs.release == 'true'
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download verified platform artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "natux-world-windows-$VERSION" --dir release
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "natux-world-macos-$VERSION" --dir release

      - name: Download signed Tauri updater bundles
        if: needs.plan.outputs.tauri == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir -p release/tauri/windows release/tauri/macos
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "natux-world-tauri-windows-$VERSION" --dir release/tauri/windows
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "natux-world-tauri-macos-$VERSION" --dir release/tauri/macos
          find release/tauri/windows release/tauri/macos -maxdepth 1 -type f -exec mv -t release/tauri {} +
          rm -rf release/tauri/windows release/tauri/macos

      - name: Install Rust stable for control-feed verification
        if: needs.plan.outputs.tauri == 'true'
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Generate signed Tauri updater metadata
        if: needs.plan.outputs.tauri == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          ROLLOUT_PCT: ${{ needs.plan.outputs.rolloutPct }}
          TAURI_MIGRATION_ENABLED: ${{ needs.plan.outputs.migrationEnabled }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          node scripts/generate-tauri-feed.mjs
          unset UPDATE_SIGNING_PRIVATE_KEY
          cargo run --manifest-path scripts/tauri-control-verifier/Cargo.toml --locked --bin verify-tauri-control-signature -- release/tauri/natux-tauri-control.json release/tauri/natux-tauri-control.json.sig
          (
            cd release/tauri
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS-tauri.txt' -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS-tauri.txt
          )

      - name: Create or complete draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "NATUX WORLD $VERSION" --generate-notes --target "$GITHUB_SHA"
          fi

          shopt -s nullglob
          assets=(release/*.exe release/*.blockmap release/latest.yml release/natux-update.json release/natux-update.json.sig release/SHA256SUMS-windows.txt release/*.dmg release/SHA256SUMS-macos.txt)
          if [[ '${{ needs.plan.outputs.tauri }}' == 'true' ]]; then
            assets+=(release/tauri/*)
          fi
          ((${#assets[@]} > 0)) || { echo 'No release assets were downloaded'; exit 1; }
          gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > release-assets.txt
          for required in latest.yml natux-update.json natux-update.json.sig SHA256SUMS-windows.txt SHA256SUMS-macos.txt; do
            grep -Fxq "$required" release-assets.txt || { echo "Missing required release asset: $required"; exit 1; }
          done
          if [[ '${{ needs.plan.outputs.tauri }}' == 'true' ]]; then
            for required in latest.json natux-tauri-control.json natux-tauri-control.json.sig NatuxWorld-${{ needs.plan.outputs.version }}-x64-setup.exe NatuxWorld-${{ needs.plan.outputs.version }}-x64-setup.exe.sig NatuxWorld-${{ needs.plan.outputs.version }}-x64-portable.zip NatuxWorld-${{ needs.plan.outputs.version }}-x86_64.app.tar.gz NatuxWorld-${{ needs.plan.outputs.version }}-x86_64.app.tar.gz.sig NatuxWorld-${{ needs.plan.outputs.version }}-x86_64.dmg NatuxWorld-${{ needs.plan.outputs.version }}-aarch64.app.tar.gz NatuxWorld-${{ needs.plan.outputs.version }}-aarch64.app.tar.gz.sig NatuxWorld-${{ needs.plan.outputs.version }}-aarch64.dmg SHA256SUMS-tauri.txt; do
              grep -Fxq "$required" release-assets.txt || { echo "Missing Tauri release asset: $required"; exit 1; }
            done
          fi
          exe_count=$(awk 'tolower($0) ~ /\.exe$/ { n++ } END { print n+0 }' release-assets.txt)
          blockmap_count=$(awk 'tolower($0) ~ /\.blockmap$/ { n++ } END { print n+0 }' release-assets.txt)
          dmg_count=$(awk 'tolower($0) ~ /\.dmg$/ { n++ } END { print n+0 }' release-assets.txt)
          test "$exe_count" -ge 2 || { echo 'Release is missing a Windows installer'; exit 1; }
          test "$blockmap_count" -ge 1 || { echo 'Release is missing the Windows installer blockmap'; exit 1; }
          test "$dmg_count" -ge 2 || { echo 'Release is missing one of the macOS DMGs'; exit 1; }
          if [[ '${{ needs.plan.outputs.channel }}' == 'beta' ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi

      - name: Publish Tauri channel control feed
        if: needs.plan.outputs.tauri == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          feed_tag="tauri-$CHANNEL-feed"
          if ! gh release view "$feed_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$feed_tag" --repo "$GITHUB_REPOSITORY" --prerelease --title "NATUX WORLD $CHANNEL updater feed" --notes "Mutable signed control metadata for the Tauri $CHANNEL update channel." --target "$GITHUB_SHA"
          fi
          gh release upload "$feed_tag" release/tauri/latest.json release/tauri/natux-tauri-control.json release/tauri/natux-tauri-control.json.sig --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$feed_tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease

          gh release view "$feed_tag" --repo "$GITHUB_REPOSITORY" --json assets,isPrerelease --jq '.assets[].name' > tauri-feed-assets.txt
          for required in latest.json natux-tauri-control.json natux-tauri-control.json.sig; do
            grep -Fxq "$required" tauri-feed-assets.txt || { echo "Missing Tauri control asset: $required"; exit 1; }
          done
