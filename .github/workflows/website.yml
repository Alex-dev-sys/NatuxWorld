name: Website CI

# Scoped to the website/ subtree so launcher-only changes don't run this, and
# website-only changes don't run the launcher release workflow (see build.yml).
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Paper plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website/natux-plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress verify

  ci:
    name: Site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
      NEXT_PUBLIC_SITE_DOMAIN: 'example.com'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Production deployment is performed by the connected Vercel project after a
  # successful push to main. Keep this workflow limited to verifiable CI work;
  # the former SSH job only ran `echo "trigger"` and could not deploy anything.
