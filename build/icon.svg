<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0008"/>
      <stop offset="55%" stop-color="#0d0006"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#FF2B4F" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#7a0020" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="medal" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#FF5470"/>
      <stop offset="55%" stop-color="#FF0037"/>
      <stop offset="100%" stop-color="#5a0014"/>
    </radialGradient>
    <linearGradient id="medalSheen" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffd9e0"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="6" result="off"/>
      <feComposite in="off" in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="inner"/>
      <feFlood flood-color="#000" flood-opacity="0.55"/>
      <feComposite in2="inner" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="192" ry="192" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="192" ry="192" fill="url(#topGlow)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="186" ry="186" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <g opacity="0.12">
    <circle cx="512" cy="512" r="450" fill="none" stroke="#FF2B4F" stroke-width="1"/>
    <circle cx="512" cy="512" r="400" fill="none" stroke="#FF2B4F" stroke-width="1"/>
    <circle cx="512" cy="512" r="350" fill="none" stroke="#FF2B4F" stroke-width="1"/>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="512" cy="512" r="320" fill="url(#medal)"/>
  </g>
  <circle cx="512" cy="512" r="320" fill="url(#medalSheen)" opacity="0.55"/>
  <circle cx="512" cy="512" r="320" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
  <circle cx="512" cy="512" r="298" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="2"/>

  <g filter="url(#innerShadow)">
    <path d="M 372 332 L 372 692 L 442 692 L 442 462 L 582 692 L 652 692 L 652 332 L 582 332 L 582 562 L 442 332 Z"
          fill="url(#nGrad)"/>
  </g>

  <g opacity="0.85">
    <rect x="372" y="324" width="70" height="6" fill="#FF2B4F"/>
    <rect x="582" y="694" width="70" height="6" fill="#FF2B4F"/>
  </g>

  <g opacity="0.9">
    <circle cx="512" cy="170" r="4" fill="#FF2B4F"/>
    <circle cx="160" cy="512" r="3" fill="#FF2B4F"/>
    <circle cx="864" cy="512" r="3" fill="#FF2B4F"/>
    <circle cx="512" cy="854" r="4" fill="#FF2B4F"/>
  </g>
</svg>
