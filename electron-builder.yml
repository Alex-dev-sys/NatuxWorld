appId: world.natux.launcher
productName: NATUX WORLD
extraMetadata:
  main: dist-electron/main.js
copyright: Copyright © 2025 NATUX WORLD
directories:
  app: build/electron-app
  output: release
  buildResources: build
# The optional runner stages the bundled renderer and a locked runtime dependency
# tree separately from the primary Tauri build and its dist/ directory.
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asar: true
extraResources:
  - from: build/lock-runtime
    to: natux-lock
    filter:
      - lock-helper*
      - natux-lock-agent.jar
# Hardens the packaged Electron binary (runAsNode / NODE_OPTIONS / inspect off).
afterPack: scripts/apply-fuses.cjs
win:
  # Unsigned local builds avoid winCodeSign's symlink privilege requirement.
  # Fuse hardening is separate from publisher signing. Release signing is enabled
  # by config/electron-builder.signed.cjs after credential preflight.
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: NATUX-WORLD-Setup-${version}-${arch}.${ext}
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NATUX WORLD
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
portable:
  artifactName: NATUX-WORLD-Portable-${version}-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.png
  category: public.app-category.games
  # Unsigned local build; the signed release profile overrides this identity.
  identity: null
  artifactName: NATUX-WORLD-${version}-${arch}.${ext}
dmg:
  artifactName: NATUX-WORLD-${version}-${arch}.${ext}
linux:
  target: AppImage
  icon: build/icon.png
  category: Game
publish:
  - provider: github
    owner: Alex-dev-sys
    repo: NatuxWorld
    releaseType: release
