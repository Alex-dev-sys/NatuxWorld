appId: world.natux.launcher
productName: NATUX WORLD
copyright: Copyright © 2025 NATUX WORLD
directories:
  output: release
  buildResources: build
# Renderer-only libs (react, react-dom, framer-motion, recharts, react-router-dom,
# zustand, lucide-react, clsx, tailwind-merge) are bundled into dist/ by Vite, so they
# live in devDependencies and are NOT packed into the asar. Only true runtime deps
# (electron-updater, yauzl) remain in `dependencies` and get packed automatically.
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asar: true
# Hardens the packaged Electron binary (runAsNode / NODE_OPTIONS / inspect off).
afterPack: scripts/apply-fuses.cjs
win:
  # The post-pack fuse hook already hardens the executable. Disabling the
  # Windows executable edit/sign step avoids requiring symbolic-link creation
  # permissions when electron-builder extracts winCodeSign on developer hosts.
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NATUX WORLD
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
portable:
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.png
  category: public.app-category.games
  identity: null
  artifactName: ${productName}-${version}-${arch}.${ext}
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target: AppImage
  icon: build/icon.png
  category: Game
publish:
  - provider: github
    owner: Alex-dev-sys
    repo: NatuxWorld
    releaseType: release
