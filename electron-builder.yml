appId: world.natux.launcher
productName: NATUX WORLD
copyright: Copyright © 2025 NATUX WORLD
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/electron/**
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NATUX WORLD
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
portable:
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}
mac:
  target: dmg
  icon: build/icon.icns
  category: public.app-category.games
linux:
  target: AppImage
  icon: build/icon.png
  category: Game
publish:
  - provider: github
    owner: Alex-dev-sys
    repo: NatuxWorld
    releaseType: release
